wha ; 지형 텍스쳐 정보 파일
;
;
; TEXTURE=[번호],[파일명]
; 번호는 0 ~ 65535의 범위 이내, 파일명은 텍스쳐 이미지 파일
; 번호가 순서대로 되야 할 필요는 없지만 맵 툴에서는 번호 순서대로 나타난다.
; 중간에 결번이 생겨도 무방하나, 중복되지 않도록 한다. ( 중복 될 경우, 아랫쪽의 것이 선택된다. )
;
; CATEGORY=[텍스쳐 분류 이름]
; 맵에디터에서 구분하기 위한 이름. 중복 사용되어도 무방하다.
;
; DETAIL=[텍스쳐 매핑 detail 비율]
; 1일 때 1타일당 1개의 텍스쳐가 매핑되고, 숫자가 커질수록 크게 매핑된다.
; 예) 0.5일때 텍스쳐 크기가 가로세로 절반씩 줄어들어서 1타일당 4장의 텍스쳐가 매핑되고,
;     4일때는 가로세로 4개씩의 타일 즉, 16개의 타일에 1장의 텍스쳐가 매핑된다.
;
; CATEGORY와 DETAIL 항목은 설정된 이후에 나타나는 TEXTURE 항목에 영향을 미친다.
;
; 공백 문자(빈 칸)는 사용하지 말 것.
; 라인의 첫칸에 세미콜론( ; )을 사용하면 주석으로 처리된다.
;
; ========= 카테고리 분류: 지역별로/ 데바, 아수라, 호라이즌, 론도...
; ========= 아이디 형식
; 다섯 자리를 기본으로 ; 가장 앞자리: 디테일/ 두번째: 식생분류 / 세번째: 색깔
; 네번째, 다섯번째: 갯수
; 식생분류, 색깔 등의 경우 갯수가 작거나 분류가 애매할 경우 그냥 0으로.
;
; 디테일: 2=2배율 / 4=4배율
; 지역: 데바=1 아수라=2 호라이즌=3 론도=4 크레타=5 공용=0
; 식생분류: 1=녹색풀/ 2=황색풀 3=흙(모래 포함)/ 4=바위/ 5=자갈/ 6=타일/ 0=기타
; 갯수: 01~99
;
;05-09-29 홍승광 : 카테고리를 컨셉으로 크게 묶어버렸음

