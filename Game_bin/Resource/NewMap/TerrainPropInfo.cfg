; 지형 장식물 정보 파일
;
;
; PROPNAME=[번호],[장식물 이름]
; 번호는 0 ~ 65535의 범위 이내, 장식물 이름은 확장자를 제외한 정해진 규칙에 따른 이름(하나의 카테고리당 개 기준
; 번호가 순서대로 되야 할 필요는 없지만 맵 툴에서는 번호 순서대로 나타난다.
; 중간에 결번이 생겨도 무방하나, 중복되지 않도록 한다. ( 중복 될 경우, 아랫쪽의 것이 선택된다. )
;
; 이름 규칙:
;
; 1. 애니메이션이 없는 일반 장식물인 경우
;    filename.cob (파일명 그대로 사용)
;
; 2. SpeedTree 장식물인 경우
;    filename.cob (파일명 그대로 사용)
;
; 3. NPC 파일인 경우
;    filename.cob (파일명 그대로 사용)
;
;
; CATEGORY=[장식물 분류 이름]
; 맵에디터에서 구분하기 위한 이름. 중복 사용되어도 무방하다.
;
;
; VISIBLE_RATIO=[가시 거리 비율]
; 게임 상에서 보이는 시야 범위 거리의 몇 %까지 장식물을 표시할지 지정한다.
; 0보다 크고 1과 같거나 작은 값을 쓴다. (0을 입력하면 강제로 1로 변경되어 읽어진다.)
; 예) 0.5인 경우 시야 범위의 50%까지만 장식물이 표시되고 그 이상 멀어지면 표시되지 않는다.
;
;
; RENDERTYPE=[general/building]
; 3D엔진에서 일반 장식물과 건물을 분리해서 처리할 수 있도록 하기 위해 구분해 준다.
; general(일반 장식물) 또는 building(건물)을 써준다.
;
; LIGHTMAPTYPE=[normal/collision/none]
; Lightmap 생성시 속성. normal인 경우 lightmap 도 생성하고,collision check도 해준다. (그림자 역할을 해준다는 의미)
; collision 일 경우 lightmap 생성은 안하고collision check만 해준다.
; none 일 경구 둘다 하지 않는다.
;
;
; <주의>
; - CATEGORY, VISIBLE_RATIO, RENDERTYPE 항목은 한번 설정되면 이후에 나타나는 모든 PROPNAME 항목에 영향을 미친다.
; - 공백 문자(빈 칸)는 사용하지 말 것.
; - 라인의 첫칸에 세미콜론( ; )을 사용하면 주석으로 처리된다.

;-------------------------------------------------------------------------
CATEGORY=[PROP]
RENDERTYPE=general
LIGHTMAPTYPE=normal
VISIBLE_RATIO=0.9

;-------------------------------------------------------------------------
CATEGORY=[달의 신전]
RENDERTYPE=general
LIGHTMAPTYPE=normal
VISIBLE_RATIO=0.8
